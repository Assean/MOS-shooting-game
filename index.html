<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOS多人連線射擊遊戲</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="shell">
      <section class="panel intro">
        <p class="eyebrow">MOS · WebRTC · 2–4 人連線對戰</p>
        <h1>MOS多人連線射擊遊戲</h1>
        <p>免費、低延遲的瀏覽器多人射擊原型。WASD 移動、滑鼠瞄準與射擊；房間建立後，遊戲資料直接在玩家之間傳送。</p>
      </section>

      <section class="panel lobby" aria-label="連線設定">
        <label>
          協商服務網址
          <input id="signalingUrl" type="url" placeholder="https://你的-worker.workers.dev" autocomplete="url" />
        </label>
        <label>
          房間碼
          <input id="roomCode" type="text" maxlength="24" placeholder="例如 taipei-night" autocomplete="off" />
        </label>
        <label>
          玩家名稱
          <input id="playerName" type="text" maxlength="20" placeholder="玩家" autocomplete="nickname" />
        </label>
        <div class="actions">
          <button id="joinButton" type="button">進入房間</button>
          <button id="copyButton" type="button" class="secondary">複製邀請連結</button>
        </div>
        <p id="connectionStatus" class="status" aria-live="polite">尚未連線</p>
        <p class="hint">首次部署後填入 Worker 網址即可。若玩家網路禁止 P2P 直連，將無法加入；這個版本沒有付費 TURN 中繼。</p>
      </section>

      <section class="panel game-panel">
        <div class="game-header">
          <strong>競技場</strong>
          <div class="game-stats">
            <span id="combatStats">生命 100　擊殺 0　死亡 0</span>
            <span id="playerCount">1 位玩家</span>
          </div>
        </div>
        <canvas id="game" width="960" height="540" aria-label="射擊遊戲畫面"></canvas>
        <p class="controls">W A S D：移動　·　滑鼠：瞄準　·　左鍵：射擊　·　生命歸零後隨機重生</p>
      </section>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
