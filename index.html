<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MOS多人連線射擊遊戲</title>
    <link rel="stylesheet" href="./style.css" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body>
    <main class="shell">
      <section class="panel intro">
        <div class="intro-topline">
          <p class="eyebrow">MOS · WebRTC · 2–4 人連線對戰</p>
          <span id="serviceBadge" class="service-badge" data-state="checking">檢查服務中</span>
        </div>
        <h1>直連競技場</h1>
        <p>免安裝、低延遲的瀏覽器多人射擊原型。建立房間後，移動與射擊會直接在玩家之間傳送。</p>
      </section>

      <section class="panel lobby" aria-label="連線設定">
        <label>
          協商服務網址
          <input id="signalingUrl" type="url" placeholder="https://你的-worker.workers.dev" autocomplete="url" />
        </label>
        <label>
          房間碼
          <input id="roomCode" type="text" maxlength="24" placeholder="例如 taipei-night" autocomplete="off" />
        </label>
        <label>
          玩家名稱
          <input id="playerName" type="text" maxlength="20" placeholder="玩家" autocomplete="nickname" />
        </label>
        <div class="actions">
          <button id="joinButton" type="button">進入房間</button>
          <button id="leaveButton" type="button" class="secondary" disabled>離開房間</button>
          <button id="copyButton" type="button" class="secondary">複製邀請連結</button>
        </div>
        <p id="connectionStatus" class="status" aria-live="polite">尚未連線</p>
        <p class="hint">首次部署後填入 Worker 網址即可。若玩家網路禁止 P2P 直連，將無法加入；這個版本沒有付費 TURN 中繼。</p>
        <details class="system-settings">
          <summary>3D 系統設定</summary>
          <div class="settings-grid">
            <label>畫質預設
              <select id="qualityPreset">
                <option value="performance">效能優先</option>
                <option value="balanced" selected>平衡</option>
                <option value="quality">畫質優先</option>
              </select>
            </label>
            <label>視野角度 <output id="fovValue">75°</output>
              <input id="fovRange" type="range" min="65" max="95" value="75" />
            </label>
          </div>
        </details>
      </section>

      <section class="panel game-panel">
        <div class="game-header">
          <div>
            <strong>競技場</strong>
            <span id="roomIndicator" class="room-indicator">尚未加入房間</span>
          </div>
          <div class="game-stats">
            <span id="combatStats">生命 100　擊殺 0　死亡 0</span>
            <span id="playerCount">1 位玩家</span>
          </div>
        </div>
        <div class="arena-layout">
          <div class="canvas-wrap">
            <canvas id="game" width="960" height="540" tabindex="0" aria-label="射擊遊戲畫面"></canvas>
            <div id="crosshair" class="crosshair" aria-hidden="true"></div>
            <p id="gameToast" class="game-toast" aria-live="polite">輸入房間資訊後即可邀請朋友加入。</p>
          </div>
          <aside class="roster" aria-label="玩家清單">
            <div class="roster-heading"><span>房內玩家</span><span id="rosterCount">01</span></div>
            <div id="playerRoster" class="player-roster"></div>
            <p class="roster-note">命中三次即可擊倒對手。戰績僅在本局同步。</p>
          </aside>
        </div>
        <p class="controls"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移動　·　滑鼠瞄準　·　左鍵射擊　·　生命歸零後隨機重生</p>
      </section>
    </main>
    <script type="module" src="./game.js"></script>
  </body>
</html>
